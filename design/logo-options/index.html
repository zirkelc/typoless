<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Typoless logo options</title>
    <style>
      /* Served from the repository root, so the site's own font files load. */
      @font-face {
        font-family: 'Fraunces';
        src: url('/www/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('/www/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2')
          format('woff2');
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/www/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }

      body {
        margin: 0;
        padding: 48px 56px;
        background: #faf9f6;
        color: #17171a;
        font-family: 'Inter', sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font: 500 34px 'Fraunces', serif;
      }
      .lead {
        margin: 0 0 36px;
        color: #6b6a70;
      }
      .option {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 40px;
        align-items: center;
        padding: 28px 0;
        border-top: 1px solid #e6e3dc;
      }
      .label {
        font: 600 12px 'Inter';
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #a8650a;
      }
      .name {
        margin: 4px 0 8px;
        font: 500 26px 'Fraunces', serif;
      }
      .idea {
        margin: 0;
        max-width: 520px;
        color: #6b6a70;
        font-size: 14px;
        line-height: 1.5;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-top: 18px;
      }
      .sizes {
        display: flex;
        align-items: end;
        gap: 14px;
      }
      .menubar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px;
        border-radius: 6px;
        background: #ececec;
        font: 500 13px 'Inter';
        color: #333;
      }
      .menubar.dark {
        background: #2b2b2e;
        color: #ddd;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hint {
        font: 11px 'Inter';
        color: #a3a1a8;
      }
    </style>
  </head>
  <body>
    <h1>Typoless: logo options</h1>
    <p class="lead">
      Each option as an app icon, at small sizes, as a one-colour menu bar symbol, and with the name.
    </p>

    <svg width="0" height="0" style="position: absolute">
      <defs>
        <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffcf5a" />
          <stop offset="1" stop-color="#f08c12" />
        </linearGradient>
        <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a2a2e" />
          <stop offset="1" stop-color="#121214" />
        </linearGradient>

        <!-- A: the squiggle under the letter straightens out -->
        <symbol id="a-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="22.5" fill="url(#amber)" />
          <text
            x="50"
            y="66"
            text-anchor="middle"
            font-family="Fraunces"
            font-weight="700"
            font-size="58"
            fill="#fff"
          >
            T
          </text>
          <path
            d="M25 79 q3.2 -4.5 6.4 0 t6.4 0 t6.4 0 t6.4 0 L75 79"
            fill="none"
            stroke="#fff"
            stroke-width="4.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="a-glyph" viewBox="0 0 100 100">
          <text x="50" y="66" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="62" fill="currentColor">T</text>
          <path
            d="M22 82 q3.5 -5 7 0 t7 0 t7 0 t7 0 L78 82"
            fill="none"
            stroke="currentColor"
            stroke-width="7"
            stroke-linecap="round"
          />
        </symbol>

        <!-- B: a single stroke, wavy then straight -->
        <symbol id="b-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="22.5" fill="url(#ink)" />
          <path
            d="M18 51 q4.6 -9 9.2 0 t9.2 0 t9.2 0 L82 51"
            fill="none"
            stroke="url(#amber)"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="b-glyph" viewBox="0 0 100 100">
          <path
            d="M10 50 q6 -13 12 0 t12 0 t12 0 L90 50"
            fill="none"
            stroke="currentColor"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>

        <!-- C: an italic serif t with the full stop that was missing -->
        <symbol id="c-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="22.5" fill="#faf9f6" />
          <rect x="0.5" y="0.5" width="99" height="99" rx="22" fill="none" stroke="#e6e3dc" />
          <text
            x="44"
            y="76"
            text-anchor="middle"
            font-family="Fraunces"
            font-style="italic"
            font-weight="600"
            font-size="78"
            fill="#17171a"
          >
            t
          </text>
          <circle cx="70" cy="71" r="7" fill="#f0a020" />
        </symbol>
        <symbol id="c-glyph" viewBox="0 0 100 100">
          <text
            x="42"
            y="84"
            text-anchor="middle"
            font-family="Fraunces"
            font-style="italic"
            font-weight="700"
            font-size="96"
            fill="currentColor"
          >
            t
          </text>
          <circle cx="76" cy="78" r="10" fill="currentColor" />
        </symbol>

        <!-- D: the text caret whose foot becomes a tick -->
        <symbol id="d-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="22.5" fill="url(#amber)" />
          <path
            d="M41 22 H59 M50 22 V58 M34 60 L46 72 L68 44"
            fill="none"
            stroke="#fff"
            stroke-width="6.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="d-glyph" viewBox="0 0 100 100">
          <path
            d="M38 12 H62 M50 12 V56 M26 60 L44 78 L76 38"
            fill="none"
            stroke="currentColor"
            stroke-width="11"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>

        <!-- E: lines of text with the app's own overlay passing over one -->
        <symbol id="e-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="22.5" fill="url(#ink)" />
          <rect x="22" y="30" width="56" height="8" rx="4" fill="#ffffff" opacity="0.28" />
          <rect x="18" y="45" width="64" height="12" rx="4" fill="url(#amber)" />
          <rect x="24" y="48.5" width="44" height="5" rx="2.5" fill="#17171a" opacity="0.55" />
          <rect x="22" y="64" width="40" height="8" rx="4" fill="#ffffff" opacity="0.28" />
        </symbol>
        <symbol id="e-glyph" viewBox="0 0 100 100">
          <rect x="16" y="18" width="68" height="12" rx="6" fill="currentColor" opacity="0.45" />
          <rect x="8" y="40" width="84" height="22" rx="6" fill="currentColor" />
          <rect x="16" y="72" width="48" height="12" rx="6" fill="currentColor" opacity="0.45" />
        </symbol>
      </defs>
    </svg>

    <template id="option">
      <div class="option">
        <svg width="200" height="200"><use /></svg>
        <div>
          <div class="label"></div>
          <div class="name"></div>
          <p class="idea"></p>
          <div class="row">
            <div class="sizes">
              <svg width="64" height="64"><use /></svg>
              <svg width="32" height="32"><use /></svg>
              <svg width="16" height="16"><use /></svg>
            </div>
            <div class="menubar">
              <svg width="16" height="16" style="color: #111"><use class="glyph" /></svg>
              <span>Menu bar</span>
            </div>
            <div class="menubar dark">
              <svg width="16" height="16" style="color: #eee"><use class="glyph" /></svg>
              <span>Dark</span>
            </div>
          </div>
          <div class="row">
            <div class="wordmark">
              <svg width="40" height="40"><use /></svg>
              <span class="word"></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <div id="options"></div>

    <script>
      const options = [
        {
          id: 'a',
          name: 'Straightened',
          idea: 'The spell checker’s squiggle turns into a straight line under a serif T: the mistake, then the fix, in one stroke. Closest to the current icon, with a reason behind it.',
          word: '<span style="font: 600 30px Fraunces">Typoless</span>',
        },
        {
          id: 'b',
          name: 'Smoothed',
          idea: 'Only the stroke: wavy, then flat. No letter, so it works in any language and stays legible at 16 pixels, which makes it the strongest menu bar symbol.',
          word: '<span style="font: 600 28px Inter; letter-spacing: -0.02em">Typoless</span>',
        },
        {
          id: 'c',
          name: 'Full stop',
          idea: 'An italic Fraunces t with an amber full stop, the punctuation the app adds. Quiet and bookish, matches the site’s serif headings. The wordmark takes the same dot.',
          word: '<span style="font: italic 600 32px Fraunces">typoless</span><span style="font: 700 32px Fraunces; color: #f0a020">.</span>',
        },
        {
          id: 'd',
          name: 'Caret',
          idea: 'The text cursor, with its foot turned into a tick: “corrected where you type”. Clear meaning, but the tick is a common symbol and less ownable.',
          word: '<span style="font: 600 28px Inter; letter-spacing: -0.02em">Typoless</span>',
        },
        {
          id: 'e',
          name: 'Overlay',
          idea: 'Three lines of text with the amber band the app draws while it reads passing over one. Unique to this product, and it repeats the hero animation on the site.',
          word: '<span style="font: 600 30px Fraunces">Typoless</span>',
        },
      ];

      const template = document.getElementById('option');
      const list = document.getElementById('options');

      for (const [index, option] of options.entries()) {
        const node = template.content.cloneNode(true);
        node.querySelectorAll('use').forEach((use) => {
          use.setAttribute('href', use.classList.contains('glyph') ? `#${option.id}-glyph` : `#${option.id}-icon`);
        });
        node.querySelector('.label').textContent = `Option ${String.fromCharCode(65 + index)}`;
        node.querySelector('.name').textContent = option.name;
        node.querySelector('.idea').textContent = option.idea;
        node.querySelector('.word').innerHTML = option.word;
        list.append(node);
      }
    </script>
  </body>
</html>
